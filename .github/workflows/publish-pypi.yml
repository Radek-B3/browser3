name: Publish Python package to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact browser3 package version to publish (for example 0.1.0)"
        required: true
        type: string
      confirmation:
        description: "Type publish-browser3 to confirm the irreversible public upload"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Python distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify explicit version and confirmation
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          python -c "import os,tomllib;
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          assert os.environ['CONFIRMATION']=='publish-browser3', 'invalid confirmation';
          assert os.environ['EXPECTED_VERSION']==version,
          f'input version {os.environ[\"EXPECTED_VERSION\"]!r} does not match pyproject {version!r}'"

      - name: Install isolated build and verification tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test the built wheel
        run: |
          python -m pip install dist/browser3-*.whl
          python -c "import browser3; assert browser3.__version__ == '${{ inputs.version }}'"
          browser3 --help

      - name: Upload immutable job artifact
        uses: actions/upload-artifact@v6
        with:
          name: browser3-python-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish approved distributions with PyPI OIDC
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v6
        with:
          name: browser3-python-${{ inputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
