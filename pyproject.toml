[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "browser3"
version = "0.1.0"
description = "Signed Browser3 runtime installer and launcher for Windows x64"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = "MPL-2.0"
license-files = ["release/public/LICENSE"]
authors = [{name = "Browser3 contributors"}]
dependencies = ["cryptography>=41,<47"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/Radek-B3/browser3"
Repository = "https://github.com/Radek-B3/browser3.git"
Issues = "https://github.com/Radek-B3/browser3/issues"

[project.scripts]
browser3 = "browser3.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["browser3*"]

[tool.setuptools.package-data]
browser3 = ["data/*.asc"]
